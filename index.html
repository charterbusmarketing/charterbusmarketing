document.addEventListener('DOMContentLoaded', async function() {

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d4829d82-65f9-4ffe-8d23-30323d58a22f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"88604112-1913-46e1-9af3-a532b0af1d06\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-10 color:var(--color-accent-700)\" style-hover=\"color:var(--color-accent-800)\">Or fill out the full form \u2192<\u002Fbutton>\n        <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ qSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(32px,5vw,52px) clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:14px;align-items:flex-start\">\n            <span style=\"width:60px;height:60px;border-radius:999px;background:var(--color-accent);color:#fff;display:grid;place-items:center;font-size:26px\">\u2713<\u002Fspan>\n            <div style=\"font-family:Oswald,sans-serif;font-size:clamp(26px,3.4vw,36px);line-height:1.05;text-transform:uppercase\">Audit request received<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">I'll review your account and reply by email with next steps.<\u002Fp>\n            <a class=\"btn btn-secondary\" href=\"https://calendly.com/mandy-charterbus/30min\" target=\"_blank\" rel=\"noopener\" style=\"font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;padding:12px 20px;font-size:12px;color:var(--color-text)\">Book a 30-min call \u2197<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <div style=\"grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px\">\n        <sc-for list=\"{{ heroStats }}\" as=\"hs\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:clamp(14px,2.4vw,18px) clamp(10px,2.4vw,22px);border-radius:var(--radius-lg);background:{{ hs.bg }}\">\n            <span style=\"font-family:Oswald,sans-serif;font-size:clamp(28px,3vw,42px);line-height:1;color:{{ hs.fg }};white-space:nowrap\">{{ hs.v }}<\u002Fspan>\n            <span style=\"font-size:clamp(9.5px,1vw,10.5px);font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ hs.l }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--cbm-band,var(--color-text));color:#fff;overflow:hidden\">{{ marqueeEl }}<\u002Fsection>\n\n  <section style=\"max-width:1320px;margin:0 auto;padding:clamp(56px,9vw,110px) clamp(20px,4vw,48px) 0\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:start\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:clamp(14px,2.4vw,22px)\">Why work with me<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:Oswald,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(34px,5.6vw,80px);line-height:.95\">I know your tools.<br><span style=\"color:transparent;-webkit-text-stroke:1.5px var(--color-text)\">I know the buses.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:clamp(16px,2vw,18px);line-height:1.6;color:color-mix(in srgb,var(--color-text) 80%,transparent);padding-top:8px;text-wrap:pretty\">I work in the same tools charter and limo companies run on every day \u2014 LimoAnywhere, The Bus Network and Moovs \u2014 and I know how FMCSA and DOT requirements work for carriers. I also know the vendors personally, so there's no learning curve on how your business books and dispatches trips.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:clamp(28px,4vw,48px)\">\n      <sc-for list=\"{{ tools }}\" as=\"tl\" hint-placeholder-count=\"5\">\n        <div style=\"padding:clamp(16px,3vw,26px);border-radius:var(--radius-lg);background:{{ tl.bg }};color:{{ tl.fg }};display:flex;flex-direction:column;gap:clamp(14px,3vw,30px);min-height:clamp(120px,16vw,150px)\">\n          <span style=\"width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:{{ tl.dot }};color:#fff;font-family:Oswald,sans-serif;font-size:16px\">{{ tl.n }}<\u002Fspan>\n          <div style=\"margin-top:auto\">\n            <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-bottom:6px\">{{ tl.kind }}<\u002Fdiv>\n            <div style=\"font-family:Oswald,sans-serif;font-size:clamp(19px,2.4vw,26px);text-transform:uppercase;line-height:1.05\">{{ tl.name }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1320px;margin:0 auto;padding:clamp(56px,9vw,110px) clamp(20px,4vw,48px) 60px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)\">\n      <h2 style=\"margin:0;font-family:Oswald,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(38px,6vw,80px);line-height:.95\">What I<br><span style=\"color:transparent;-webkit-text-stroke:1.5px var(--color-text)\">focus on<\u002Fspan><\u002Fh2>\n      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goServices }}\" style=\"font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:10px 16px\">All services \u2192<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px\">\n      <sc-for list=\"{{ core }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"padding:clamp(22px,4vw,34px);border-radius:var(--radius-lg);background:{{ s.bg }};color:{{ s.fg }};display:flex;flex-direction:column;gap:14px;min-height:clamp(170px,26vw,300px);grid-column:{{ s.span }}\">\n          <span style=\"align-self:flex-start;padding:6px 12px;border-radius:999px :grid;grid-template-columns:repeat(2,minmax(0,1fr))\">\n            <sc-for list=\"{{ snap.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"padding:16px 0 12px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:8px;min-width:0\">\n                <span style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ r.l }}<\u002Fspan>\n                <span style=\"font-family:Oswald,sans-serif;font-size:clamp(22px,2.8vw,36px);line-height:1;color:{{ r.c }}\">{{ r.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(56px,9vw,110px)\">\n    <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:16px\">My PPC approach<\u002Fdiv>\n    <p style=\"margin:0 0 clamp(24px,4vw,48px);max-width:760px;font-size:clamp(16px,2vw,19px);line-height:1.6;color:color-mix(in srgb,var(--color-text) 80%,transparent)\">PPC campaigns for charter and group transportation companies live or die on a few specific things: how tightly the account is structured around trip type and search intent, how disciplined the keyword and negative-keyword strategy is, and how quickly underperforming ads and keywords get cut.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px\">\n      <sc-for list=\"{{ approach }}\" as=\"ap\" hint-placeholder-count=\"6\">\n        <div style=\"padding:clamp(18px,3vw,24px) clamp(18px,3vw,26px);border-radius:var(--radius-lg);background:{{ ap.bg }};display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <span style=\"flex:none;width:42px;height:42px;bo title }}<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;flex:1;color:color-mix(in srgb,var(--color-text) 78%,transparent)\">{{ c.desc }}<\u002Fp>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"font-family:Archivo,sans-serif;align-self:flex-start;padding:10px 16px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\">{{ c.addLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:{{ ctaJustify }};margin-top:20px\">\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goContact }}\" style=\"font-family:Archivo,sans-serif;padding:16px 28px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff\">Continue with {{ selCount }} selected \u2192<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPricing }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"max-width:1320px;margin:0 auto;padding:clamp(48px,8vw,100px) clamp(20px,4vw,48px) 60px;text-align:{{ hAlign }}\">\n    <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:clamp(14px,2.4vw,24px)\">Pricing<\u002Fdiv>\n    <h1 style=\"margin:0;font-family:Oswald,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(36px,7vw,100px);line-height:.95\">Clear prices.<br><span style=\"color:transparent;-webkit-text-stroke:2px var(--color-text)\">No agency markup.<\u002Fspan><\u002Fh1>\n    <p style=\"max-width:620px;margin:clamp(18px,3vw,28px) {{ hAuto }} 0;font-size:clamp(16px,2vw,19px);line-height:1.6;color:color-mix(in srgb,var(--color-text) 80%,transparent)\">You work with me directly, so you pay for the work and nothing else.<\u002Fp>\n  <\u002Fsection>\n  <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:stretch\">\n    <sc-for list=\"{{ prices }}\" as=\"pr\" hint-placeholder-count=\"3\">\n      <div style=\"padding:clamp(28px,3.4vw,40px);border-radius:calc(var(--radius-lg) * 1.3);background:{{ pr.bg }};color:{{ pr.fg }};display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <span style=\"font-family:Oswald,sans-serif;font-size:clamp(22px,2.4vw,28px);line-height:1.1;text-transform:uppercase\">{{ pr.name }}<\u002Fspan>\n          <sc-if value=\"{{ pr.featured }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:6px 12px;border-radius:999px;background:#fff;color:var(--color-accent-800);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase\">Core service<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\"><span style=\"font-family:Oswald,sans-serif;font-size:clamp(46px,6vw,80px);line-height:1\">{{ pr.price }}<\u002Fspan><span style=\"font-size:17px\">{{ pr.unit }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:600\">{{ pr.alt }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid {{ pr.rule }};flex:1\">\n          <sc-for list=\"{{ pr.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5\"><span style=\"flex:none;width:20px;height:20px;border-radius:999px;background:{{ pr.dot }};color:{{ pr.dotFg }};display:grid;place-items:center;font-size:11px;margin-top:1px\">\u2713<\u002Fspan>{{ it }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goContact }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:16px;border-radius:999px;background:{{ pr.btnBg }};color:{{ pr.btnFg }};font-siz );border-radius:calc(var(--radius-lg) * 1.5);background:{{ cs.bg }};display:flex;flex-direction:column;gap:clamp(12px,2vw,18px)\">\n        <span style=\"align-self:flex-start;padding:6px 14px;border-radius:999px;background:{{ cs.ink }};color:#fff;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase\">{{ cs.sub }}<\u002Fspan>\n        <div style=\"font-family:Oswald,sans-serif;font-size:clamp(28px,4.4vw,60px);line-height:1;text-transform:uppercase\">{{ cs.title }}<\u002Fdiv>\n        <p style=\"margin:0;font-size:clamp(15px,2vw,18px);line-height:1.6;max-width:760px\">{{ cs.desc }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:4px\">\n          <sc-for list=\"{{ cs.stats }}\" as=\"stat\" hint-placeholder-count=\"4\">\n            <div style=\"padding:clamp(14px,3vw,24px) clamp(16px,3vw,26px);border-radius:var(--radius-lg);background:#fff;color:var(--color-text)\">\n              <div style=\"font-family:Oswald,sans-serif;font-size:clamp(28px,4vw,54px);line-height:1;color:{{ cs.ink }}\">{{ stat.v }}<\u002Fdiv>\n              <div style=\"margin-top:6px;font-size:11px;letter-spacing:.14em;line-height:1.4;text-transform:uppercase\">{{ stat.l }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cs.hasTable }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:8px;padding:8px 26px 18px;border-radius:var(--radius-lg);background:#fff;color:var(--color-text);overflow-x:auto\">\n            <div style=\"display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(4,minmax(110px,1fr));min-width:680px\">\n              <sc-for list=\"{{ tableCells }}\" as=\"tc\" hint-placeholder-count=\"15\">\n                <div style=\"padding:16px 12px 16px 0;border-bottom:1px solid var(--color-divider);font-size:{{ tc.size }};font-family:{{ tc.font }};letter-spacing:{{ tc.ls }};text-transform:{{ tc.tt }};color:{{ tc.color }}\">{{ tc.t }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProcess }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"max-width:1320px;margin:0 auto;padding:clamp(48px,8vw,100px) clamp(20px,4vw,48px) 60px;text-align:{{ hAlign }}\">\n    <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:clamp(14px,2.4vw,24px)\">How I work<\u002Fdiv>\n    <h1 style=\"margin:0;font-family:Oswald,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(36px,7vw,100px);line-height:.95\">Direct and<br><span style=\"color:transparent;-webkit-text-stroke:2px var(--color-text)\">hands-on<\u002Fspan><\u002Fh1>\n    <p style=\"max-width:620px;margin:clamp(18px,3vw,28px) {{ hAuto }} 0;font-size:clamp(16px,2vw,19px);line-height:1.6;color:color-mix(in srgb,var(--color-text) 80%,transparent)\">Engagements are direct and hands-on \u2014 you're working with me, not being passed through an agency team. A typical engagement looks like this:<\u002Fp>\n  <\u002Fsection>\n  <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(56px,9vw,110px);display:flex;flex-direction:column;gap:14px\">\n    <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px 48px;align-items:center;padding:clamp(20px,4vw,44px);border-radius:var(--radius-lg);background:{{ st.bg }};color:{{ st.fg }}\">\n        <div style=\"display:flex;align-items:center;gap:24px\">\n          <span style=\"font-family:Oswald,sans-serif;font-size:clamp(42px,7vw,96px);line-height:1;color:transparent;-webkit-text-stroke:1.5px {{ st.fg }}\">{{ st.n }}<\u002Fspan>\n          <span style=\"font-family:Oswald,sans-serif;font-size:clamp(21px,3vw,38px);text-transform:uppercase;line-height:1.05\">{{ st.title }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:clamp(15px,2vw,18px);line-height:1.6;max-width:560px\">{{ st.desc }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"max-width:1320px;margin:0 auto;padding:clamp(48px,8vw,100px) clamp(20px,4vw,48px) clamp(40px,6vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(28px,5vw,64px);align-items:start\">\n    <div style=\"text-align:{{ hAlign }}\">\n      <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:clamp(14px,2.4vw,24px)\">About<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:Oswald,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(36px,7vw,100px);line-height:.95\">Manish<br><span style=\"color:transparent;-webkit-text-stroke:2px var(--color-text)\">Kumar<\u002Fspan><\u002Fh1>\n      <div style=\"margin-top:24px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;line-height:2;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">PPC Campaigns \u00b7 CRM \u00b7 Dispatch \u00b7 Process Optimization<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px;font-size:clamp(16px,2vw,19px);line-height:1.6;color:color-mix(in srgb,var(--color-text) 82%,transparent);padding-top:0\">\n      <p style=\"margin:0;font-family:Oswald,sans-serif;font-size:clamp(21px,2.4vw,28px);line-height:1.25;text-transform:uppercase;color:var(--color-text)\">PPC Campaign Specialist for Charter Bus &amp; Group Transportation Companies<\u002Fp>\n      <p style=\"margin:0\">Pay-per-click advertising is what I specialize in \u2014 not marketing in general, but the specific discipline of building, structuring, and continuously optimizing PPC campaigns so every dollar of ad spend is working as hard as possible.<\u002Fp>\n      <p style=\"margin:0\">Over the last 5 years I've managed PPC campaigns for group transportation companies ranging from early-stage operators to accounts spending $60,000 a month, with a consistent focus on driving down cost-per-lead while scaling volume. I also set up the CRM, dispatch, and process work around the campaigns, so the leads a PPC account generates don't go cold before they turn into bookings.<\u002Fp>\n      <p style=\"margin:0\">I know the tools charter and limo companies work on \u2014 LimoAnywhere, The Bus Network, Moovs \u2014 and the FMCSA and DOT side of running a carrier. I also know the vendors personally.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px\">\n        <a class=\"btn btn-secondary\" href=\"https://www.linkedin.com/in/chaurasiamanishh/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:Archivo,sans-serif;padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-text)\">LinkedIn \u2197<\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"https://calendly.com/mandy-charterbus/30min\" target=\"_blank\" rel=\"noopener\" style=\"font-family:Archivo,sans-serif;padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-text)\">Book a call \u2197<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(56px,9vw,110px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px\">\n    <sc-for list=\"{{ heroStats }}\" as=\"hs\" hint-placeholder-count=\"3\">\n      <div style=\"padding:clamp(16px,2.4vw,30px) clamp(12px,2.4vw,30px);border-radius:var(--radius-lg);background:var(--color-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px \u002Fspan>\n            <span style=\"font-family:Oswald,sans-serif;font-size:clamp(17px,4.4vw,20px);line-height:1.25;max-width:100%;overflow-wrap:anywhere;color:{{ ch.vColor }};text-decoration:{{ ch.vLine }};text-underline-offset:3px\">{{ ch.v }}<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;color:var(--color-text)\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;padding:clamp(14px,3vw,22px) clamp(18px,5vw,36px);border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\"><span>CBM \u00b7 Free audit<\u002Fspan><span style=\"color:var(--color-accent-700)\">No obligation<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ submit }}\" style=\"padding:4px clamp(18px,5vw,36px) clamp(20px,5vw,36px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(16px,4vw,36px)\">\n        <sc-for list=\"{{ fields }}\" as=\"fd\" hint-placeholder-count=\"6\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0;padding:clamp(12px,2.6vw,22px) 0 8px;border-bottom:1px solid var(--color-divider)\">\n            <span style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ fd.label }}<\u002Fspan>\n            <input type=\"{{ fd.type }}\" placeholder=\"{{ fd.ph }}\" required=\"{{ fd.req }}\" style=\"all:unset;min-width:0;font-family:Oswald,sans-serif;font-size:clamp(15px,3.6vw,20px);text-transform:uppercase;color:var(--color-text)\">\n          <\u002Flabel>\n        <\u002Fsc-for>\n        <div style=\"grid-column:1/-1;padding:clamp(16px,3vw,24px) 0 14px;border-bottom:1px solid var(--color-divider)\">\n          <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-bottom:12px\">What do you need help with?<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px clamp(6px,2vw,12px)\">\n            <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"9\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:clamp(4px,1.2vw,6px);min-width:0;font-size:clamp(11px,3vw,13px);font-weight:500;line-height:1.2;color:{{ c.textFg }}\">\n                <span style=\"flex:none;width:clamp(18px,4.8vw,22px);height:clamp(18px,4.8vw,22px);border-radius:999px;display:grid;place-items:center;font-size:clamp(11px,3vw,13px);font-weight:600;background:{{ c.markBg }};color:{{ c.markFg }}\">{{ c.chipMark }}<\u002Fspan>\n                <span>{{ c.chipLabel }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:clamp(16px,3vw,24px) 0 12px;border-bottom:1px solid var(--color-divider)\">\n          <span style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Current monthly ad spend (optional)<\u002Fspan>\n          <textarea rows=\"2\" placeholder=\"e.g. $5,000 on Google Ads, or none yet\" style=\"all:unset;font-size:clamp(14px,1.8vw,16px);line-height:1.5;color:var(--color-text)\"><\u002Ftextarea>\n        <\u002Flabel>\n        <button type=\"submit\" class=\"btn btn-primary\" style=\"font-family:Archivo,sans-serif;grid-column:1/-1;margin-top:clamp(18px,3vw,28px);padding:clamp(14px,2vw,18px);font-size:clamp(12.5px,1.4vw,14px);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff\">{{ fBtn }}<\u002Fbutton>\n        <sc-if value=\"{{ fHasErr }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"grid-column:1/-1;margin-top:12px;font-size:14px;line-height:1.5;color:#b42318\">{{ fErr }}<\u002Fdiv><\u002Fsc-if>\n        <input type=\"text\" name=\"website_url\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"position:absolute;left:-9999px;width:1px;height:1px;opacity:0\">\n      <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:clamp(36px,6vw,64px) clamp(18px,5vw,36px);display:flex;flex-direction:column;gap:16px;align-items:flex-start\">\n          <span style=\"width:64px;height:64px;border-radius:999px;background:var(--color-accent);color:#fff;display:grid;place-items:center;font-size:28px\">\u2713<\u002Fspan>\n          <div style=\"font-family:Oswald,sans-serif;font-size:clamp(28px,4vw,40px);text-transform:uppercase\">Request received<\u002Fdiv>\n          <p style=\"margin:0;font-size:17px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 78%,transparent)\">I'll reply by email with next steps.<\u002Fp>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ reset }}\" style=\"font-family:Archivo,sans-serif;margin-top:8px;padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-text)\">Send another<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<sc-if value=\"{{ notContact }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width:1320px;margin:0 auto clamp(40px,6vw,64px);padding:0 clamp(20px,4vw,48px);width:100%;box-sizing:border-box\">\n    <div style=\"border-radius:calc(var(--radius-lg) * 1.5);background:var(--cbm-band,var(--color-accent));color:#fff;padding:clamp(28px,6vw,80px) clamp(22px,6vw,80px);display:flex;justify-content:space-between;align-items:end;gap:clamp(20px,3vw,32px);flex-wrap:wrap;text-align:{{ hAlign }};border-top:6px solid var(--cbm-band-edge,transparent)\">\n      <div style=\"display:flex;flex-direction:column;gap:clamp(12px,2vw,18px);flex:1 1 300px\">\n        <span style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cbm-band-kicker,#fff)\">1:1 \u00b7 Not an agency queue<\u002Fspan>\n        <h2 style=\"margin:0;font-family:Oswald,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(34px,6vw,84px);line-height:.95\">Ready for more<br><span style=\"color:transparent;-webkit-text-stroke:1.5px #fff\">booked trips?<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;align-items:stretch;flex:1 1 240px;max-width:380px\">\n        <button sc-camel-on-click=\"{{ goContact }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:clamp(13px,2vw,16px) 24px;border-radius:999px;background:#fff;color:var(--color-text);font-size:clamp(12.5px,1.4vw,14px);font-weight:600;letter-spacing:.1em;text-transform:uppercase\" style-hover=\"background:var(--color-accent-100)\">{{ cta }} \u2192<\u002Fbutton>\n        <a href=\"https://wa.me/918860669691\" target=\"_blank\" rel=\"noopener\" style=\"text-align:center;padding:clamp(13px,2vw,16px) 24px;border-radius:999px;background:#25d366;color:#0b2e17;font-size:clamp(12.5px,1.4vw,14px);font-weight:600;letter-spacing:.1em;text-transform:uppercase\" style-hover=\"background:#1fbf5b;color:#0b2e17\">Chat on WhatsApp \u2192<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<footer style=\"background:var(--cbm-band,var(--color-text));color:#fff\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,64px) clamp(20px,4vw,48px) 28px;display:grid;grid-template-columns:{{ fCols }};gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-family:Oswald,sans-serif;font-size:24px;text-transform:uppercase\">
